worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ============================================================
    # REMS — Nginx Reverse Proxy Configuration
    # Handles: SSL termination, rate limiting, webhook routing
    # ============================================================

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream definitions
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream dashboard_backend {
        server dashboard:3001;
        keepalive 16;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name rems.example.com;

        ssl_certificate     /etc/ssl/rems/cert.pem;
        ssl_certificate_key /etc/ssl/rems/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000";

        # Dashboard
        location / {
            proxy_pass http://dashboard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API — general endpoints
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Auth endpoints — stricter rate limiting
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_backend;
        }

        # Webhook endpoints — relaxed rate limit (OTAs send bursts)
        # Raw body preservation is critical for HMAC signature verification
        location /webhooks/ {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Do NOT buffer webhook bodies (pass-through for signature verification)
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 1m;
        }
    }
}
